[project]
name = "campus-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "firebase-admin>=7.7.0",
    "google-cloud-firestore>=2.34.1",
    "pillow>=13.0.0",
    "pydantic>=2.11,<3",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "tzdata>=2026.6",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus"]

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
